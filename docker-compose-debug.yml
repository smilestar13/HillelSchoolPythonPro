version: "3.1"

services:
  backend:
    build: .
    command: daphne -b 0.0.0.0 -p 8000 project.asgi:application
    volumes:
      - .:/project
    expose:
      - 8000
    restart: always
    depends_on:
      - redis
    env_file:
      - .env
  redis:
    image: redis:latest
    restart: always
  celery:
    build: .
    command: celery -A project worker -l debug
    restart: always
    volumes:
      - .:/project
    depends_on:
      - redis
  celery_beat:
    build: .
    command: celery -A project beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    restart: always
    volumes:
      - .:/project
    depends_on:
      - redis
      - celery
  nginx:
    image: nginx:latest
    ports:
      - 80:80
    volumes:
      - ./nginx/nginx-debug.conf:/etc/nginx/conf.d/default.conf
      - ./static_files/:/project/static_files/
      - ./media/:/project/media/
    depends_on:
      - backend
    restart: always
